on:
  push:
    branches:
      - main

jobs:
  sign-powershell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get list of changed .ps1 files
        id: find-changed-ps1
        run: |
          CHANGED_PS1=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.ps1$' || true)
          if [ -z "$CHANGED_PS1" ]; then
            echo "No .ps1 files changed."
            echo "found_files=false" >> $GITHUB_OUTPUT
          else
            FILE_LIST=$(echo "$CHANGED_PS1" | paste -sd "," -)
            echo "Found changed .ps1 files: $FILE_LIST"
            echo "ps1_files=$FILE_LIST" >> $GITHUB_OUTPUT
            echo "found_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Sign changed .ps1 files with Azure Trusted Signing
        if: steps.find-changed-ps1.outputs.found_files == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-credentials: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }
          signing-profile-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          files: ${{ steps.find-changed-ps1.outputs.ps1_files }}
