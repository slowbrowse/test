on:
  push:
    paths:
      - '**/*.ps1'

jobs:
  sign-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find PowerShell scripts
        id: find-scripts
        run: |
          echo "scripts=$(find . -type f -name '*.ps1' | paste -sd ' ' -)" >> $GITHUB_OUTPUT

      - name: Sign each script
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          certificate-profile-name: ${{ secrets.SIGNING_ACCOUNT_NAME }}
          files-folder: ${{ github.workspace }}\
          files-folder-filter: ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Upload signed scripts
        uses: actions/upload-artifact@v4
        with:
          name: signed-scripts
          path: signed-*.ps1
